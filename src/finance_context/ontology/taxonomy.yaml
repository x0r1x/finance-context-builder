  - id: liq.pre_revolver_cash
    labels: [Pre-revolver cash, Pre-revolver closing]
  - id: liq.cash_headroom
    labels: [Cash headroom, Headroom vs min cash, Headroom]
    section_hints: [cash, covenant position, liquidity]
  - id: liq.trough_cash
    labels: [Trough cash]
  - id: liq.trough_period
    labels: [Trough cash week, Trough week]
