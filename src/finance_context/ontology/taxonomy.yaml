version: 2
facet_defaults:
  pnl: {statement: pnl, nature: flow, basis: accrual}
  bs: {statement: bs, nature: balance, basis: accrual}
  cf: {statement: cf, nature: flow, basis: cash}
  val: {statement: val, nature: flow}
  ops: {statement: ops}
  fx: {statement: fx}
  cov: {statement: cov, nature: flow, unit: ratio}
  covenant: {statement: cov, nature: flow, unit: ratio}
  debt: {statement: bs, nature: balance, basis: accrual}
  liq: {statement: cf, nature: balance, basis: cash}
calculations:
  - parent: cf.net
    terms:
      - {concept: cf.receipts, weight: 1}
      - {concept: cf.disbursements, weight: -1}
patterns:
  - concept: cf.net
    score: 0.93
    evidence: net flow phrasing
    when:
      any:
        - {label_contains: [cumulative net]}
        - {label_in: [net cf, net cashflow, net cash flow]}
        - {label_tokens: [net, flow]}
      unless:
        label_contains: [present, financing]
  - concept: bs.debt
    score: 0.91
    evidence: debt opening/closing balance
    when:
      section_contains: [debt]
      any:
        - {label_tokens: [opening, balance]}
        - {label_tokens: [closing, balance]}
  - concept: bs.goodwill
    score: 0.94
    evidence: goodwill opening/closing
    when:
      section_contains: [goodwill]
      label_contains: [b/f, c/f, brought forward, carried forward, balance b, balance c]
  - concept: bs.equity
    score: 0.91
    evidence: equity funding opening/closing
    when:
      section_contains: [equity]
      label_contains: [b/f, c/f, brought forward, carried forward, balance b, balance c]
      unless:
        label_contains: [available]
  - concept: bs.ppe
    score: 0.91
    evidence: depreciation book opening/closing
    when:
      section_contains: [depreciation]
      label_contains: [b/f, c/f, brought forward, carried forward, balance b, balance c]
      unless:
        section_contains: [goodwill]
  - concept: bs.debt
    score: 0.91
    evidence: funding or repayment opening/closing
    when:
      any:
        - {section_contains: [debt]}
        - {section_contains: [repayment]}
        - {section_contains: [funding]}
      label_contains: [b/f, c/f, brought forward, carried forward, balance b, balance c]
      unless:
        section_contains: [equity]
  - skip_concept: bs.ppe
    when:
      section_contains: [goodwill]
  - skip_concept: bs.ap
    when:
      section_contains: [debt]
  - skip_concept: cf.disbursements
    when:
      label_contains: [cfads, available for debt, available for equity, cash flow available]
  - skip_concept: pnl.tax
    when:
      section_contains: [cfs, cash flow, cashflow]
      label_contains: [tax]
      unless:
        label_contains: [rate, deferred, accrued, taxable, pre-tax, before tax]
  - concept: cf.capex
    score: 0.9
    evidence: parent capex or uses section
    when:
      section_contains: [capex, uses]
      unless:
        any:
          - {label_contains: [sources, drawdown, equity, interest, total uses, total sources,
              lifetime, turbine, capacity, inflation, cpi, escalation, mw, share premium,
              share capital, goodwill, balance b, balance c, brought forward, carried forward,
              b/f, c/f, loan amount, full-wrap, due diligence]}
          - {label_in: [debt]}
  - concept: pnl.opex
    score: 0.9
    evidence: parent operating costs section
    when:
      any:
        - {section_contains: [opex]}
        - {section_contains: [operating]}
        - {section_contains: [costs]}
      unless:
        any:
          - {section_contains: [capex, uses, source]}
          - {label_contains: [cashflow, cash flow, ebitda, ebit, revenue, cfads, tax, traffic,
              lifetime, turbine, capacity, inflation, cpi, escalation, mw, uncertainty,
              hedge, payout]}
  - concept: pnl.revenue
    score: 0.9
    evidence: parent revenue section
    when:
      section_contains: [revenue]
      unless:
        label_contains: [traffic, volume, cost, tax, opex, price, other income, lifetime,
          turbine, capacity, inflation, cpi, escalation, mw, uncertainty, hedge, duration]
  - concept: pnl.da
    score: 0.9
    evidence: parent d and a section
    when:
      section_contains: [da, amortisation, amortization, depreciation]
      unless:
        label_contains: [asset, opening, closing, value, lifetime, straight line, years,
          b/f, c/f, brought forward, carried forward, balance b, balance c]
  - concept: cf.net
    score: 0.96
    evidence: cash flow line
    when:
      label_in: [cash flow]
      unless:
        label_contains: [available, operating, net]
  - concept: cf.tax_paid
    score: 0.92
    evidence: cash tax on cashflow statement
    when:
      section_contains: [cfs, cash flow, cashflow]
      label_contains: [income tax, tax]
      unless:
        label_contains: [rate, deferred, accrued, taxable, pre-tax, before tax]
  - concept: cf.equity_issue
    score: 0.94
    evidence: construction or sources equity injection
    when:
      any:
        - {label_contains: [equity injected, injected]}
        - {label_tokens: [equity], section_contains: [sources, construction, irr, ratios]}
      unless:
        any:
          - {section_contains: [balance]}
          - {label_contains: [available, fcfe, returns, ratio]}
  - skip_concept: bs.equity
    when:
      any:
        - {label_contains: [equity injected, injected]}
        - {label_tokens: [equity], section_contains: [sources, construction, irr, ratios]}
      unless:
        section_contains: [balance]
  - skip_concept: cf.receipts
    when:
      label_contains: [cash in]
      any:
        - {label_contains: [cash out]}
        - {label_contains: [in cash out]}
  - skip_concept: cf.disbursements
    when:
      label_contains: [cash in]
      any:
        - {label_contains: [cash out]}
  - concept: cf.equity_cashflow
    score: 0.94
    evidence: signed equity irr cash line
    when:
      any:
        - {label_contains: [total cash in cash out, cash in cash out, cash flow to equity, equity cash flow]}
        - {label_contains: [total cash], section_contains: [equity irr, irr]}
      unless:
        label_contains: [available, fcfe, ratio]
  - skip_concept: bs.equity
    when:
      section_contains: [funding]
      label_contains: [b/f, c/f, brought forward, carried forward, balance b, balance c]
      unless:
        section_contains: [equity]
