    section_hints: [term loan, amortisation, debt]
  - id: debt.commitment_fee
    labels: [Commitment fee, Undrawn commitment fee]
    facets: {statement: cf, nature: flow, direction: outflow}
    section_hints: [revolver, undrawn]
  - id: debt.revolver_limit
    labels: [Revolver facility, Revolving credit limit, RCF limit]
  - id: debt.available_credit
    labels: [Available credit, Undrawn, Undrawn available]
  - id: debt.sculpting
    labels: [Debt sculpting, Sculpted repayment, Sculpted principal]
    facets: {statement: cf, nature: flow, direction: outflow}
  - id: liq.min_cash_target
    labels: [Min cash target, Minimum cash balance, Cash floor]
