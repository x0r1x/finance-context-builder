services:
  finance-context:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: ../.env
        required: false
    # `.env` already passes SOFFICE_BIN and XLS_CONVERT_TIMEOUT_SEC through.
    # The image has `soffice` on PATH. Keep the conversion timeout below
    # JOB_TIMEOUT_SEC (defaults 300 and 3600) so a hung soffice fails the job
    # before the server stops the process.
    # Optional MinIO copy: MINIO_ENDPOINT, MINIO_BUCKET, MINIO_ACCESS_KEY,
    # MINIO_SECRET_KEY, and MINIO_PREFIX. The endpoint is http:// or https://
    # plus a host and port. Leave the first four
    # unset and DuckDB stays on DATA_DIR. Set all four together in the env
    # file. This file does not start MinIO and does not interpolate MINIO_*.
    # The healthcheck only calls /healthz.
    environment:
      DATA_DIR: /app/data
    # 4 GiB container. One job stops at 1536 MiB RSS.
    # The slot count does not divide that cap.
    mem_limit: 4g
    volumes:
      - ../data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
