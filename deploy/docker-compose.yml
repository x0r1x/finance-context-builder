services:
  finance-context:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: ../.env
        required: false
    # `.env` already passes SOFFICE_BIN and XLS_CONVERT_TIMEOUT_SEC through.
    # The image has `soffice` on PATH. Keep the conversion timeout below
    # JOB_TIMEOUT_SEC (defaults 300 and 3600) so a hung soffice fails the job
    # before the server stops the process.
    environment:
      DATA_DIR: /app/data
    # 4 GiB container. Two job slots derive a 1536 MiB RSS cap
    # (three quarters of this limit, split across MAX_CONCURRENT_JOBS).
    mem_limit: 4g
    volumes:
      - ../data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
