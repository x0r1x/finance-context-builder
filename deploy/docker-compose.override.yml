# Local Redis and MinIO. Production does not use this file.
services:
  redis:
    image: redis:8.6.7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Docker Hub no longer serves minio/minio. This Alpine image is that
  # release: entrypoint `minio`, data in /data. The image user cannot write
  # the volume (nologin, /data is root), so the local process runs as root.
  # The image has wget and no mc; init installs Alpine's mcli.
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "apk add --no-cache minio-client && mcli alias set local http://minio:9000 minioadmin minioadmin && mcli mb local/finance-context || mcli ls local/finance-context"
    restart: "no"

  finance-context:
    environment:
      # .env often points the host at localhost. Inside this compose network
      # the Redis service name is redis. environment overrides env_file.
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: finance-context
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  redis-data:
  minio-data:
