[project]
name = "finance-context-builder"
version = "0.1.0"
description = "Parse Excel cash-flow models into JSON and Markdown context"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=16",
    "fastapi>=0.141.1",
    "lxml>=5.3",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "scipy>=1.13",
    "typer>=0.16",
    "uvicorn>=0.32",
    "xlrd>=2.0.2",
    "rq>=2.12,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
    "xlsxwriter>=3.2.9",
    "xlwt>=1.3.0",
]

[project.scripts]
finance-context = "finance_context.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_context"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "e2e_models: runs against local real Excel workbooks",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
